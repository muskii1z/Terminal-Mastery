# Terminal Mastery — Netlify deploy config
#
# Runs on Netlify's Next.js runtime rather than a static export: sign-in
# needs the /auth/callback route, which runs on the server.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
