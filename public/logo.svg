<svg viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Blue to Purple gradient for terminal box -->
    <linearGradient id="terminalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>

    <!-- Green gradient for text -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#22C55E;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Terminal Box with rounded corners -->
  <rect x="20" y="20" width="160" height="160" rx="25" ry="25" fill="url(#terminalGrad)" stroke="none"/>

  <!-- Terminal prompt symbol ">" -->
  <path d="M55 90 L85 70 L85 80 L70 90 L85 100 L85 110 Z" fill="#22C55E"/>

  <!-- Terminal underscore "_" -->
  <rect x="95" y="105" width="50" height="8" fill="#22C55E"/>

  <!-- "TM" Text -->
  <text x="220" y="140" font-family="Arial, sans-serif" font-size="120" font-weight="bold" fill="url(#textGrad)">TM</text>
</svg>